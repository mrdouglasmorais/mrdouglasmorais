name: Generate Contribution Snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#312E81&color_dots=#F8FAFC,#CFFAFE,#67E8F9,#06B6D4,#0E7490
            dist/github-contribution-grid-snake-dark.svg?color_snake=#F8FAFC&color_dots=#0B1220,#155E75,#0891B2,#22D3EE,#A5F3FC
            dist/github-contribution-grid-snake.gif?color_snake=#312E81&color_dots=#F8FAFC,#CFFAFE,#67E8F9,#06B6D4,#0E7490&color_background=#F8FAFC
            dist/github-contribution-grid-snake-dark.gif?color_snake=#F8FAFC&color_dots=#0B1220,#155E75,#0891B2,#22D3EE,#A5F3FC&color_background=#050816

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
